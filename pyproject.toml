[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-autonomous-redteam-tool-fuzzer"
version = "0.1.0"
description = "Coverage-guided fuzzer generating pathological and boundary-value tool inputs to test agent resilience against untrusted environment errors"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-autonomous-redteam-tool-fuzzer = "agent_autonomous_redteam_tool_fuzzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_autonomous_redteam_tool_fuzzer*"]
